<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NetWatch Terminal</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #02060b;
      color: #7bf0ff;
      font-family: monospace;
    }

    .nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    button {
      background: #04121a;
      color: #7bf0ff;
      border: 1px solid #00f2fe;
      padding: 8px 12px;
      cursor: pointer;
      font: inherit;
    }

    button.active {
      background: #00f2fe;
      color: #02060b;
      font-weight: bold;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .workspace {
      display: flex;
      gap: 16px;
      align-items: stretch;
    }

    .preview {
      width: 900px;
      max-width: 100%;
      flex-shrink: 0;
      aspect-ratio: 1 / 1;
      border: 1px solid #00f2fe;
      background: #010408;
    }

    .editor-wrap {
      position: relative;
      flex: 1;
      min-width: 300px;
      height: 900px;
      border: 1px solid #00f2fe;
      background: #040e18;
    }

    .editor-backdrop,
    .editor-input {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 10px;
      border: 0;
      font-family: monospace;
      font-size: 12px;
      line-height: 1.45;
      tab-size: 2;
      white-space: pre-wrap;
      overflow-wrap: break-word;
      overflow: auto;
    }

    .editor-backdrop {
      color: #7bf0ff;
      pointer-events: none;
      z-index: 1;
    }

    .editor-input {
      color: transparent;
      caret-color: #00f2fe;
      background: transparent;
      resize: none;
      outline: none;
      z-index: 2;
    }

    .editor-input::selection {
      background: rgba(0, 242, 254, 0.25);
    }

    .hl-token {
      background: rgba(255, 221, 0, 0.25);
      color: #ffea00;
      border-bottom: 1px solid #ffea00;
      border-radius: 2px;
    }

    .hover-tip {
      position: fixed;
      padding: 5px 8px;
      background: #020910;
      color: #ffea00;
      border: 1px solid #ffea00;
      font-size: 11px;
      pointer-events: none;
      z-index: 9999;
      white-space: nowrap;
    }

    .db-search {
      background: #04121a;
      color: #7bf0ff;
      border: 1px solid #00f2fe;
      padding: 8px 12px;
      font: inherit;
      margin-bottom: 12px;
      width: 320px;
      max-width: 100%;
    }

    .db-search:focus {
      outline: 1px solid #00f2fe;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #040e18;
    }

    th,
    td {
      border: 1px solid #00f2fe;
      padding: 8px 12px;
      text-align: left;
    }

    th {
      background: #04121a;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 1280px) {
      .workspace {
        flex-direction: column;
      }

      .preview {
        width: 100%;
      }

      .editor-wrap {
        height: 450px;
      }
    }
  </style>
</head>
<body>
  <nav id="nav" class="nav" aria-label="Terminal Views"></nav>

  <section id="svgView">
    <div class="controls">
      <button id="copyBtn" type="button">Copy SVG</button>
      <button id="downloadBtn" type="button">Download SVG</button>
    </div>
    <div class="workspace">
      <div id="preview" class="preview"></div>
      <div class="editor-wrap">
        <pre id="svgHighlight" class="editor-backdrop" aria-hidden="true"></pre>
        <textarea id="svgSource" class="editor-input" aria-label="SVG Source" spellcheck="false"></textarea>
      </div>
    </div>
  </section>

  <section id="dbView" hidden>
    <input id="dbSearch" class="db-search" type="search" aria-label="Search Watchtower Database" placeholder="Search..." />
    <table>
      <thead>
        <tr>
          <th scope="col">Name</th>
          <th scope="col">Affiliation</th>
          <th scope="col"># of Traces</th>
          <th scope="col">STATUS</th>
        </tr>
      </thead>
      <tbody id="dbBody"></tbody>
    </table>
  </section>

  <div id="hoverTip" class="hover-tip" hidden>Remove and replace (including []) with your character name</div>

  <script type="module">
    const navEl = document.getElementById("nav");
    const svgViewEl = document.getElementById("svgView");
    const dbViewEl = document.getElementById("dbView");
    const dbSearchEl = document.getElementById("dbSearch");
    const dbBodyEl = document.getElementById("dbBody");
    const previewEl = document.getElementById("preview");
    const sourceEl = document.getElementById("svgSource");
    const highlightEl = document.getElementById("svgHighlight");
    const hoverTip = document.getElementById("hoverTip");
    const copyBtn = document.getElementById("copyBtn");
    const downloadBtn = document.getElementById("downloadBtn");

    const collator = new Intl.Collator(undefined, { sensitivity: "base", numeric: true });
    const WATCHTOWER_TAB = "watchtower";

    let entries = [];
    let watchtowerData = [];
    let activeTab = 0;

    async function fetchJson(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`Failed to load ${url} (${res.status})`);
      return res.json();
    }

    function updateHighlight(code) {
      highlightEl.replaceChildren();
      const parts = code.split(/(\[AGENT NAME\])/g);

      for (const part of parts) {
        if (part === "[AGENT NAME]") {
          const span = document.createElement("span");
          span.className = "hl-token";
          span.textContent = part;
          highlightEl.append(span);
        } else if (part) {
          highlightEl.append(document.createTextNode(part));
        }
      }

      if (code.endsWith("\n")) {
        highlightEl.append(document.createTextNode(" "));
      }
    }

    function renderDatabase() {
      const q = dbSearchEl.value.trim().toLowerCase();

      const rows = watchtowerData
        .filter((row) =>
          [row.name, row.affiliation, row.traces, row.status]
            .some((val) => String(val ?? "").toLowerCase().includes(q))
        )
        .sort((a, b) => collator.compare(a.name ?? "", b.name ?? ""));

      const fragment = document.createDocumentFragment();

      for (const row of rows) {
        const tr = document.createElement("tr");
        for (const key of ["name", "affiliation", "traces", "status"]) {
          const td = document.createElement("td");
          td.textContent = row[key] ?? "";
          tr.append(td);
        }
        fragment.append(tr);
      }

      dbBodyEl.replaceChildren(fragment);
    }

    function renderView() {
      for (const btn of navEl.querySelectorAll("button")) {
        const isCurrent = btn.dataset.tab === String(activeTab);
        btn.classList.toggle("active", isCurrent);
        btn.setAttribute("aria-current", isCurrent ? "page" : "false");
      }

      if (activeTab === WATCHTOWER_TAB) {
        svgViewEl.hidden = true;
        dbViewEl.hidden = false;
        hoverTip.hidden = true;
        renderDatabase();
        return;
      }

      const item = entries[activeTab];
      if (!item) return;

      svgViewEl.hidden = false;
      dbViewEl.hidden = true;

      previewEl.innerHTML = item.svgText;
      sourceEl.value = item.svgText;
      updateHighlight(item.svgText);
    }

    dbSearchEl.addEventListener("input", renderDatabase);

    sourceEl.addEventListener("input", () => {
      const item = entries[activeTab];
      if (!item) return;
      item.svgText = sourceEl.value;
      previewEl.innerHTML = sourceEl.value;
      updateHighlight(sourceEl.value);
    });

    sourceEl.addEventListener("scroll", () => {
      highlightEl.scrollTop = sourceEl.scrollTop;
      highlightEl.scrollLeft = sourceEl.scrollLeft;
    });

    sourceEl.addEventListener("mousemove", (e) => {
      const overToken = [...highlightEl.querySelectorAll(".hl-token")].some((token) => {
        const rect = token.getBoundingClientRect();
        return (
          e.clientX >= rect.left &&
          e.clientX <= rect.right &&
          e.clientY >= rect.top &&
          e.clientY <= rect.bottom
        );
      });

      hoverTip.hidden = !overToken;
      if (overToken) {
        hoverTip.style.left = `${e.clientX + 12}px`;
        hoverTip.style.top = `${e.clientY + 12}px`;
      }
    });

    sourceEl.addEventListener("mouseleave", () => {
      hoverTip.hidden = true;
    });

    copyBtn.addEventListener("click", async () => {
      await navigator.clipboard.writeText(sourceEl.value);
      copyBtn.textContent = "Copied";
      setTimeout(() => {
        copyBtn.textContent = "Copy SVG";
      }, 1200);
    });

    downloadBtn.addEventListener("click", () => {
      const item = entries[activeTab];
      if (!item) return;
      const blob = new Blob([sourceEl.value], { type: "image/svg+xml;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = item.file.split("/").pop() || `${item.id}.svg`;
      a.click();
      URL.revokeObjectURL(url);
    });

    async function init() {
      const [manifest, db] = await Promise.all([
        fetchJson("./badges.json"),
        fetchJson("./watchtower.json")
      ]);

      watchtowerData = db;
      entries = await Promise.all(
        manifest.map(async (item) => {
          const res = await fetch(item.file);
          if (!res.ok) throw new Error(`Failed to load ${item.file} (${res.status})`);
          return { ...item, svgText: await res.text() };
        })
      );

      const navFragment = document.createDocumentFragment();

      entries.forEach((item, idx) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = item.label;
        btn.dataset.tab = String(idx);
        btn.addEventListener("click", () => {
          activeTab = idx;
          renderView();
        });
        navFragment.append(btn);
      });

      const dbBtn = document.createElement("button");
      dbBtn.type = "button";
      dbBtn.textContent = "NODE-01-WATCHTOWER";
      dbBtn.dataset.tab = WATCHTOWER_TAB;
      dbBtn.addEventListener("click", () => {
        activeTab = WATCHTOWER_TAB;
        renderView();
      });
      navFragment.append(dbBtn);

      navEl.replaceChildren(navFragment);
      renderView();
    }

    init().catch((err) => {
      console.error(err);
      navEl.textContent = err.message;
    });
  </script>
</body>
</html>
