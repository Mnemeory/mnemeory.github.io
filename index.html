<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NCRP | NetWatch Terminal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Rajdhani:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="terminal-header">
    <img class="terminal-logo terminal-logo-netwatch" src="./assets/netwatch-logo.png" alt="NetWatch" />
    <nav id="nodeNav" class="node-nav" aria-label="Nodes"></nav>
    <img class="terminal-logo terminal-logo-gateway" src="./assets/gateway-logo.png" alt="Gateway terminal logo" />
    <nav id="subNav" class="sub-nav" aria-label="Node Selections"></nav>
  </header>

  <section id="watchtowerView" hidden>
    <h1 class="node-title">Node-01-Watchtower</h1>
    <input
      id="dbSearch"
      class="db-search"
      type="search"
      aria-label="Search Watchtower Database"
      placeholder="Search name, affiliation, traces, or status..."
    />
    <table>
      <thead>
        <tr>
          <th scope="col">Name</th>
          <th scope="col">Affiliation</th>
          <th scope="col">Status</th>
          <th scope="col">Times Traced</th>
        </tr>
      </thead>
      <tbody id="dbBody"></tbody>
    </table>
  </section>

  <section id="libraryView" hidden>
    <h1 class="node-title">Node-02-Library</h1>
  </section>

  <section id="schoolhouseView" hidden>
    <h1 class="node-title">Node-03-Schoolhouse</h1>
    <div class="controls">
      <button id="copyBtn" type="button">Copy SVG</button>
      <button id="downloadBtn" type="button">Download SVG</button>
    </div>
    <div class="workspace">
      <div id="preview" class="preview"></div>
      <div class="editor-wrap">
        <pre id="svgHighlight" class="editor-backdrop" aria-hidden="true"></pre>
        <textarea id="svgSource" class="editor-input" aria-label="SVG Source" spellcheck="false"></textarea>
      </div>
    </div>
  </section>

  <div id="hoverTip" class="hover-tip" hidden>Remove and replace (including []) with your character name</div>

  <dialog id="notesDialog" class="notes-dialog" aria-labelledby="notesTitle">
    <div class="notes-panel">
      <div class="notes-heading">
        <div>
          <p class="notes-kicker">WATCHTOWER // NETRUNNER FILE</p>
          <h2 id="notesTitle"></h2>
        </div>
        <button id="closeNotes" class="notes-close" type="button" aria-label="Close notes">×</button>
      </div>
      <div class="notes-scanline" aria-hidden="true"></div>
      <ol id="notesList" class="notes-list"></ol>
    </div>
  </dialog>

  <script type="module" src="./app.js"></script>
</body>
</html>
