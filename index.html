<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NetWatch Terminal</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <nav id="nodeNav" class="node-nav" aria-label="Nodes"></nav>
  <nav id="subNav" class="sub-nav" aria-label="Node Selections"></nav>

  <section id="watchtowerView" hidden>
    <input
      id="dbSearch"
      class="db-search"
      type="search"
      aria-label="Search Watchtower Database"
      placeholder="Search name, affiliation, traces, or status..."
    />
    <table>
      <thead>
        <tr>
          <th scope="col">Name</th>
          <th scope="col">Affiliation</th>
          <th scope="col"># of Traces</th>
          <th scope="col">STATUS</th>
        </tr>
      </thead>
      <tbody id="dbBody"></tbody>
    </table>
  </section>

  <section id="libraryView" hidden></section>

  <section id="schoolhouseView" hidden>
    <div class="controls">
      <button id="copyBtn" type="button">Copy SVG</button>
      <button id="downloadBtn" type="button">Download SVG</button>
    </div>
    <div class="workspace">
      <div id="preview" class="preview"></div>
      <div class="editor-wrap">
        <pre id="svgHighlight" class="editor-backdrop" aria-hidden="true"></pre>
        <textarea id="svgSource" class="editor-input" aria-label="SVG Source" spellcheck="false"></textarea>
      </div>
    </div>
  </section>

  <div id="hoverTip" class="hover-tip" hidden>Remove and replace (including []) with your character name</div>

  <script type="module" src="./app.js"></script>
</body>
</html>
