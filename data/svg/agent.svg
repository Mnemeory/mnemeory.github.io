<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="100%" height="100%">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&amp;family=Rajdhani:wght@400;500;600;700&amp;display=swap');
.orbit-text { font-family: Orbitron, sans-serif; }
.name-text, .title-text { font-family: Rajdhani, sans-serif; }</style>
    <radialGradient id="bgGrad2" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#091b2c"/>
      <stop offset="50%" stop-color="#040e18"/>
      <stop offset="100%" stop-color="#010408"/>
    </radialGradient>
    <linearGradient id="shieldInner2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#04121a"/>
      <stop offset="100%" stop-color="#01070d"/>
    </linearGradient>
    <pattern id="scanlines2" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#00f2fe" stroke-width="0.3" opacity="0.06"/>
    </pattern>
    <pattern id="grid2" width="45" height="45" patternUnits="userSpaceOnUse">
      <path d="M 45 0 L 0 0 0 45" fill="none" stroke="#00f2fe" stroke-width="0.5" opacity="0.08"/>
    </pattern>
    <filter id="deepGlow2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feGaussianBlur stdDeviation="2" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="subtleGlow2" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <path id="textPath2" d="M 450, 450 m -330, 0 a 330,330 0 1,1 660,0 a 330,330 0 1,1 -660,0"/>
  </defs>
  <rect width="900" height="900" fill="url(#bgGrad2)"/>
  <rect width="900" height="900" fill="url(#grid2)"/>
  <rect width="900" height="900" fill="url(#scanlines2)"/>
