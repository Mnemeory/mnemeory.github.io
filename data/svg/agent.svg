    <circle cx="450" cy="450" r="286" fill="none" stroke="#00f2fe" stroke-width="1" opacity="0.3" stroke-dasharray="6 3"/>
    <text font-size="13.5" font-weight="bold" fill="#7bf0ff" letter-spacing="2.53" class="orbit-text">
      <textPath href="#textPath2" dominant-baseline="central">NC-SERVER // NETWATCH-REG-02 // NODE-WATCHTOWER-7 // ENFORCED // NC-SERVER // NETWATCH-REG-02 // NODE-WATCHTOWER-7 // ENFORCED // NC-SERVER // NETWATCH-REG-02 // ENFORCED //</textPath>
    </text>
